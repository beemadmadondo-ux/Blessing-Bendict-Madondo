<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DJ Beemad</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 15px;
        }
        h1 { color: #38bdf8; margin: 10px 0 2px 0; font-size: 1.5rem; }
        p { color: #94a3b8; font-size: 0.9rem; margin-top: 0; }
        .deck-container {
            background-color: #1e293b;
            max-width: 100%;
            margin: 10px auto;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 2px solid #334155;
        }
        .turntable {
            width: 120px;
            height: 120px;
            background: #0f172a;
            border: 5px solid #38bdf8;
            border-radius: 50%;
            margin: 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #94a3b8;
            font-size: 0.85rem;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }
        button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            width: 100%;
        }
        label { font-size: 0.85rem; color: #94a3b8; }
        input[type="range"], input[type="file"] {
            width: 100%;
            margin-top: 5px;
            padding: 5px;
        }
    </style>
</head>
<body>

    <h1>DJ Beemad</h1>
    <p>Mobile Edition</p>

    <div class="deck-container">
        <div id="turntable" class="turntable">BEEMAD</div>

        <div class="controls">
            <div>
                <label>Load Track:</label>
                <input type="file" id="audioFile" accept="audio/*">
            </div>

            <button id="playBtn">PLAY / PAUSE</button>

            <div>
                <label>Volume</label>
                <input type="range" id="volumeControl" min="0" max="1" step="0.01" value="1">
            </div>

            <div>
                <label>Tempo / Speed</label>
                <input type="range" id="rateControl" min="0.5" max="2" step="0.1" value="1">
            </div>
        </div>
    </div>

    <audio id="audioPlayer" preload="auto"></audio>

    <script>
        const audioFile = document.getElementById('audioFile');
        const audioPlayer = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const volumeControl = document.getElementById('volumeControl');
        const rateControl = document.getElementById('rateControl');
        const turntable = document.getElementById('turntable');

        audioFile.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                audioPlayer.src = URL.createObjectURL(file);
            }
        });

        playBtn.addEventListener('click', function() {
            if (audioPlayer.paused) {
                audioPlayer.play();
                playBtn.style.backgroundColor = '#4ade80';
                turntable.style.animation = "spin 2s linear infinite";
            } else {
                audioPlayer.pause();
                playBtn.style.backgroundColor = '#38bdf8';
                turntable.style.animation = "none";
            }
        });

        volumeControl.addEventListener('input', function() {
            audioPlayer.volume = volumeControl.value;
        });

        rateControl.addEventListener('input', function() {
            audioPlayer.playbackRate = rateControl.value;
        });
    </script>

    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

</body>
</html>
